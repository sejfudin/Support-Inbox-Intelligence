name: CI

# Runs on every push and every pull request targeting master or development.
# prod or dev automatically via Render's auto-deploy.

on:
  pull_request:
    branches: [master, development]
  push:
    branches: [master, development]

jobs:
  backend:
    name: Backend — install, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # No test suite exists yet. Once one is added (e.g. `npm test` runs Jest/Vitest/etc.),
      # remove the `if: false` guard below so this step actually runs and can fail the build.
      - name: Run tests (placeholder — no tests written yet)
        if: false
        run: npm test

  frontend:
    name: Frontend — install, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      # Same placeholder as backend — wire this up once frontend tests exist.
      - name: Run tests (placeholder — no tests written yet)
        if: false
        run: npm test